prefix: <gradient:#FFFFFF:#7A7A7A>GLOOM</gradient> »

alerts-enabled: '{prefix} &#FFFFFFОповещения &#00FF00включены'
alerts-disabled: '{prefix} &#FFFFFFОповещения &#FF2B2Bвыключены'

verbose-enabled: '{prefix} &#FFFFFFПодробный вывод включен'
verbose-disabled: '{prefix} &#FFFFFFПодробный вывод &#FF2B2Bвыключен'

holograms-enabled: '{prefix} &#FFFFFFПоказ голограмм &#00FF00включен'
holograms-disabled: '{prefix} &#FFFFFFПоказ голограмм &#FF2B2Bвыключен'

alert: '{prefix} &#FFE500{model} &#FFFFFF{player} &#FF2B2B{probability} &#777777buffer
  &#FFFFFF{buffer} &#777777vl &#FFFFFF{vl} &#777777{verbose}'
verbose: '{prefix} &#FFE500{model} &#FFFFFF{player} &#FFFFFF{probability} &#777777buffer
  &#FFFFFF{buffer} &#777777vl &#FFFFFF{vl} &#777777{verbose}'

history-header: <gradient:#FFFFFF:#7A7A7A>GLOOM</gradient> &#FFFFFFИстория {player}
  &#777777{page}/{max_pages}
history-entry: '{prefix} &#777777{server} &#FFFFFF{check_name} &#FF2B2Bx{vl} &#777777{verbose}
  &#777777{time_ago} назад'
history-only-player: '{prefix} &#FF2B2BМеню истории доступно только игроку'
history-no-data: '{prefix} &#FF2B2BНет данных истории для &#FFFFFF{player}'

reloading: '{prefix} &#777777Перезагрузка конфигурации...'
reloaded: '{prefix} &#FFFFFFКонфигурация перезагружена'

help:
  header: '<gradient:#FFFFFF:#7A7A7A>GLOOM</gradient> &#FFFFFFКоманды:'
  format: '&#FFFFFF/{command} &8- &#999999{description}'
  footer: '&#999999Справка: &#FFFFFF/gloom help'

status:
  header: <gradient:#FFFFFF:#7A7A7A>GLOOM</gradient> &#FFFFFFСтатус системы
  backend: '{prefix} &#777777AI &#FFFFFF{status}'
  requests_today: '{prefix} &#777777Запросов за день &#FFFFFF{requests_today}'
  requests_remaining: '{prefix} &#777777Осталось запросов &#FFFFFF{requests_remaining}'
  checking: '{prefix} &#777777Проверяю подключение к AI...'
  connected: '&#FFFFFFПодключен'
  not_connected: '&#FF2B2BНе подключен'
  no_license: '{prefix} &#FF2B2BAPI-ключ не настроен. &#777777Используйте &#FFFFFF/gloom
    connect <код>'
  error: '{prefix} &#FF2B2BНе удалось получить статус: &#FFFFFF{error}'
  unlimited: '&#FFFFFFБезлимитно'
  model: '{prefix} &7Активная модель: <gradient:#FFFFFF:#AAAAAA>{model}</gradient>'
  plan: '{prefix} &7Тариф: <gradient:#FFFFFF:#AAAAAA>{plan}</gradient>'

connect:
  status_missing: '{prefix} &#FF2B2BAPI-ключ не задан. &#777777Получите код на &#FFFFFFgloomai.pro'
  status_saved: '{prefix} &#FFFFFFAPI-ключ сохранён. &#777777Доступ проверяется при
    анализе игроков.'
  usage: '{prefix} &#999999Использование: &#FFFFFF/gloom connect <код или API-ключ>
    &#999999или &#FFFFFF/gloom connect status'
  invalid_panel_url: '{prefix} &#FF2B2BУкажите корректный HTTPS-адрес ml_check.panel_url'
  already_connecting: '{prefix} &#FFE500Подключение уже выполняется...'
  connecting: '{prefix} &#777777Подключаю сервер к кабинету...'
  network_error: '{prefix} &#FF2B2BНе удалось связаться с сайтом. Повторите подключение
    позже.'
  rate_limited: '{prefix} &#FFE500Слишком много попыток. Подождите 15 минут.'
  rejected: '{prefix} &#FF2B2BКлюч или код недействителен, IP не разрешён или достигнут
    лимит IP. Проверьте кабинет.'
  success: '{prefix} &#FFFFFFСервер успешно подключён. &#777777API-ключ сохранён,
    перезапуск не требуется.'
  save_error: '{prefix} &#FF2B2BНе удалось сохранить конфиг. Проверьте права на checks.yml
    и создайте новый код.'
  invalid_response: '{prefix} &#FF2B2BСайт вернул некорректный ответ. Создайте новый
    код и повторите попытку.'

monitor:
  action_bar:
    format: '&#FFFFFF{probability}%  &#777777{trend}  &#FFFFFF{buffer}'
    waiting: <gradient:#FFFFFF:#7A7A7A>GLOOM</gradient> &#FFFFFF{player} &#777777ожидание
      анализа...

    trend:
      up: '&#FFE500+{value}'
      down: '&#FFE500{value}'
      equal: '&#7777770.00'

  only_player: '{prefix} &#FF2B2BЭту команду может выполнить только игрок'
  enabled: '{prefix} &#FFFFFFМонитор запущен для {player}'
  disabled: '{prefix} &#FF2B2BМонитор выключен'
  not_running: '{prefix} &#FF2B2BМонитор сейчас не запущен'
  switched: '{prefix} &#FFFFFFЦель монитора: {player}'
  player_not_found: '{prefix} &#FF2B2BИгрок не найден'
  target_left: '{prefix} &#FF2B2BМонитор остановлен. &#FFFFFF{player} &#777777вышел
    с сервера'
