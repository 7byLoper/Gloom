combat: 60

ml_check:
  # Включает единственную актуальную проверку rotation_temporal.
  enable: true
  # URL inference API.
  analyze_server: https://api.gloomai.pro/v1/inference
  # Количество кадров в одном временном окне модели.
  sequence: 50
  # Количество кадров между соседними запросами.
  step: 20
  buffer:
    # Буфер, при превышении которого создаётся нарушение.
    flag: 100.0
    # Значение буфера после нарушения.
    reset_on_flag: 50.0
    # Рост буфера: (probability - 0.9) * multiplier.
    multiplier: 100.0
    # Снижение буфера: (0.9 - probability) * decrease.
    decrease: 8.0
  worldguard:
    # Включает проверку регионов WorldGuard.
    enabled: true
    # Регионы, где ML-проверка отключена, сгруппированные по мирам.
    # enabled-regions имеет приоритет; "*" обозначает любой мир.
    disabled-regions: # мир и регион, где проверка не работает
      spawn:
        - "spawn"
    enabled-regions: # мир и регион, где проверка работает
      spawn:
        - "pvp"
